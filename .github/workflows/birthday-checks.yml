name: Birthday page checks (no deploy)
on:
  push:
    branches:
      - surpresa-aniversario-del-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
      - name: Browser verification (five breakpoints)
        env:
          SITE_PASSWORD: ci-local-test-only
          APP_SECRET: ci-only-never-production-key-not-used-in-live-site
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run start > /tmp/birthday-next.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 2
          done
          node scripts/qa-birthday.mjs
      - name: Attach responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-responsive-screenshots
          path: /tmp/birthday-qa-screenshots/
          if-no-files-found: warn
          retention-days: 1
